<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>SheetNative — Offline</title>
<style>
  body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:#07090f; color:#f8fafc;
         font-family:'Segoe UI',-apple-system,sans-serif; }
  .card { text-align:center; max-width:420px; padding:40px; }
  .logo { width:72px; height:72px; margin:0 auto 20px; border-radius:18px;
          background:linear-gradient(135deg,#6366f1,#a855f7); display:flex; align-items:center; justify-content:center;
          font-size:36px; color:#fff; }
  h1 { font-size:22px; margin:0 0 10px; }
  p { color:#8b98a9; font-size:14px; line-height:1.6; margin:0 0 26px; }
  button { background:linear-gradient(90deg,#6366f1,#8b5cf6); color:#fff; border:0; border-radius:12px;
           padding:12px 34px; font-size:15px; font-weight:600; cursor:pointer; }
  button:hover { filter:brightness(1.12); }
  .reason { margin-top:18px; color:#475569; font-size:11px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">✦</div>
    <h1>You're offline</h1>
    <p>SheetNative needs a connection to sync your business data.<br/>Your changes are safe and will sync when you're back online.</p>
    <button onclick="retry()">Try again</button>
    <div class="reason" id="reason"></div>
  </div>
  <script>
    document.getElementById("reason").textContent = new URLSearchParams(location.search).get("reason") || "";
    function retry() { location.href = new URLSearchParams(location.search).get("url") || "https://sheetnative.vercel.app"; }
    setInterval(() => { fetch("https://sheetnative.vercel.app", { mode: "no-cors" }).then(retry).catch(() => {}); }, 5000);
  </script>
</body>
</html>
