# Local development stack: app + PostgreSQL + Redis
# The Verdent-hosted build uses the managed Supabase binding instead.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sheetnative
      POSTGRES_PASSWORD: sheetnative
      POSTGRES_DB: sheetnative
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://sheetnative:sheetnative@db:5432/sheetnative
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis

volumes:
  pgdata:
